<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <title>{{.Title}}</title>
</head>
<body>
    <h1>{{ .Title }}</h1>
    
    <form action="/ascii-art" method="POST">
            <input type="text" id="textInput" name="text" placeholder="Enter your text" 
                   hx-post="/" 
                   hx-trigger="keyup changed delay:0ms
                   hx-target="#outputblock">
        <input type="radio" name="banner" value="standard" checked> standard
        <input type="radio" name="banner" value="shadow"> shadow
        <input type="radio" name="banner" value="thinkertoy"> thinkertoy
        <button type="submit">Generate</button>
    </form>
    <pre id="outputblock">{{ if .Result }}{{ .Result }}{{ end }}</pre>
</body>
</html>
