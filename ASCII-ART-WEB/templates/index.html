<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/templates/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    
</head>
<body>
    <h1 class="header">{{.Title}}</h1>
    <p>Turn images and text into shareable ASCII art.</p>
    <form action="ascii-art" method="POST">
    <input type="text" name="text" placeholder="Enter Your Text Here">
    <input type="radio" name="banner" value="standard.txt" checked> standard
    <input type="radio" name="banner" value="shadow.txt"> shadow
    <input type="radio" name="banner" value="thinkertoy.txt"> thinkertoy
    <button type="submit">Generate</button>
     </form>
     <pre id="output">{{.Result}}</pre>
</body>
</html>
