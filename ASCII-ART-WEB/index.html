<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Card</title>
    <style>
        :root {
            --primary-glow: linear-gradient(135deg, #ff7b00 0%, #ff0055 100%);
            --secondary-glow: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #080710;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        /* Glowing background shapes */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-glow);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
            top: 20%;
            left: 20%;
        }

        .bg-glow.two {
            background: var(--secondary-glow);
            top: 60%;
            left: 65%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            width: 350px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 0, 85, 0.3);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 3px;
            background: rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .card p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 30px;
            background: var(--primary-glow);
            color: white;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow two"></div>

    <div class="card">
        <img src="https://unsplash.com" alt="Profile" class="avatar">
        <h2>Elena Rostova</h2>
        <p>UI/UX Designer & Front-end Developer</p>
        <a href="#" class="btn">View Profile</a>
    </div>
</body>
</html>
