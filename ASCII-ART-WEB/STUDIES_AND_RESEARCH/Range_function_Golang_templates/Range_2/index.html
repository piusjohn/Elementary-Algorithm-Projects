<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <ul>
      <b>TODO</b>
    {{range .}}
        {{if ne .Done true}}
        <li>{{.Name}}</li>
        {{end}}
    {{end}}
  </ul>
  <b>DONE</b>
      {{range .}}
          {{if .Done}}
              <li>{{.Name}}</li>
          {{end}}
    {{end}}
</body>
</html>
