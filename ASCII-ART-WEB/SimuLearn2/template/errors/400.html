<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>400 - Bad Request</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
    padding:40px;
    max-width:650px;
}

.error-code{
    font-size:9rem;
    font-weight:800;
    background:linear-gradient(90deg,#38bdf8,#60a5fa,#818cf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:2rem;
    margin-top:-10px;
    margin-bottom:15px;
}

p{
    color:#cbd5e1;
    line-height:1.7;
    font-size:1.05rem;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    transition:.3s ease;
    box-shadow:0 8px 20px rgba(59,130,246,.35);
}

.btn:hover{
    transform:translateY(-3px);
    background:#2563eb;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    animation:move 15s linear infinite;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    top:-80px;
    left:-80px;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:-60px;
    right:-60px;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    top:20%;
    right:15%;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

@keyframes move{
    from{transform:rotate(0deg) translateX(20px) rotate(0deg);}
    to{transform:rotate(360deg) translateX(20px) rotate(-360deg);}
}

@media(max-width:600px){
    .error-code{
        font-size:6rem;
    }

    h1{
        font-size:1.5rem;
    }

    p{
        font-size:1rem;
    }
}
</style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">
    <div class="error-code">400</div>
    <h1>Bad Request</h1>
    <p>
        Oops! The server couldn't understand your request.
        This might be due to invalid data, a malformed URL,
        or missing information.
    </p>

    <a href="/" class="btn">Return Home</a>
</div>

</body>
</html>
