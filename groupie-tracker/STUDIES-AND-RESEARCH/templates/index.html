<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="background-image: url('/static/group-background.png') !important; background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; background-attachment: fixed !important; margin: 0; min-height: 100vh; width: 100%;">

<div class="dashboard-grid">
    {{range .}}
    <a href="/artist/{{.ID}}" class="artist-card">
        <img src="{{.Image}}" alt="Artist Photo">
        <p>{{.Name}}</p>
    </a>
    {{end}}
</div>

</body>
</html>
